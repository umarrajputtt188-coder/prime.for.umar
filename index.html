
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar Prime</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  padding: 22px;
  background: #19263a;
  color: #65e6bd;
  font-size: 26px;
  font-weight: bold;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 420px;
  margin: 35px auto;
}

.card {
  background: #1b2940;
  padding: 24px;
  border-radius: 14px;
  border: 1px solid #34445d;
}

h2 {
  text-align: center;
  margin-top: 0;
}

label {
  display: block;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 7px;
  border: 1px solid #45546b;
  background: #101827;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 7px;
  background: #65e6bd;
  color: #10251f;
  font-weight: bold;
  font-size: 16px;
}

a {
  color: #65e6bd;
  cursor: pointer;
}

.switch {
  text-align: center;
  margin-top: 20px;
}

.features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

.feature {
  padding: 22px 10px;
  text-align: center;
  background: #1b2940;
  border-radius: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aab6c8;
  font-size: 13px;
}

.hidden {
  display: none;
}

#message {
  text-align: center;
  color: #65e6bd;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>Umar Prime</header>

<div class="container">

  <section class="card" id="authCard">
    <h2 id="heading">Create Account</h2>

    <form id="authForm">
      <div id="nameBox">
        <label for="name">Full Name</label>
        <input id="name" type="text"
          placeholder="Enter your name"
          autocomplete="name">
      </div>

      <label for="email">Email Address</label>
      <input id="email" type="email"
        placeholder="Enter your email"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Enter password"
        minlength="8"
        autocomplete="new-password" required>

      <button id="submitBtn" type="submit">
        Create Account
      </button>
    </form>

    <p class="switch">
      <span id="switchText">Already registered?</span>
      <a id="switchBtn">Login</a>
    </p>

    <p id="message" role="status"></p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>Welcome to Umar Prime!</h2>
    <p id="welcome"></p>
    <p>This is your website dashboard.</p>
    <button id="logoutBtn" type="button">Logout</button>
  </section>

  <div class="features">
    <div class="feature">👤<p>My Account</p></div>
    <div class="feature">🔐<p>Security</p></div>
    <div class="feature">📊<p>Dashboard</p></div>
    <div class="feature">⚙️<p>Settings</p></div>
  </div>

</div>

<footer>
  Umar Prime | Independent Website
  <p>Secure account services require backend integration.</p>
</footer>

<script>
const form = document.getElementById("authForm");
const heading = document.getElementById("heading");
const nameBox = document.getElementById("nameBox");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switchBtn");
const switchText = document.getElementById("switchText");
const message = document.getElementById("message");
const authCard = document.getElementById("authCard");
const dashboard = document.getElementById("dashboard");

let loginMode = false;

switchBtn.addEventListener("click", function() {
  loginMode = !loginMode;
  heading.textContent = loginMode ? "Login" : "Create Account";
  submitBtn.textContent = loginMode ? "Login" : "Create Account";
  nameBox.classList.toggle("hidden", loginMode);
  nameInput.required = !loginMode;
  passwordInput.autocomplete =
    loginMode ? "current-password" : "new-password";
  switchText.textContent = loginMode
    ? "New here?" : "Already registered?";
  switchBtn.textContent = loginMode
    ? "Create Account" : "Login";
  message.textContent = "";
});

form.addEventListener("submit", function(event) {
  event.preventDefault();

  message.textContent =
    "This is the website interface only. Real account registration and login require a secure authentication backend.";
});

document.getElementById("logoutBtn")
  .addEventListener("click", function() {
    dashboard.classList.add("hidden");
    authCard.classList.remove("hidden");
    form.reset();
    message.textContent = "";
  });
</script>

</body>
</html>
